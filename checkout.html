<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - GadgetGrub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#ff6b35;
    --accent-dark:#e0511f;
    --ink:#1f2430;
    --muted:#5c6470;
    --bg:#faf7f2;
    --line:#e9e2d8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;}
  header{border-bottom:1px solid var(--line);background:#ffffff;}
  .nav{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;}
  .nav a{color:var(--ink);text-decoration:none;font-family:'Fraunces',serif;font-weight:700;font-size:1.2rem;}
  .nav a span{color:var(--accent);}
  .back{font-size:0.85rem;color:var(--muted);text-decoration:none;font-family:'Inter',sans-serif;font-weight:500;}
  .back:hover{color:var(--accent);}
  main{max-width:640px;margin:0 auto;padding:48px 20px 80px;}
  h1{font-family:'Fraunces',serif;font-size:1.8rem;margin-bottom:8px;}
  .sub{color:var(--muted);margin-bottom:36px;}

  /* ================================================================
     PAYMENT SECTION - YOUR CODE GOES HERE
     Sir Drew: paste your payment embed / button / form code below,
     inside this .pay-zone box. Everything else on this page stays.
     ================================================================ */
  .pay-zone{
    border:2px dashed var(--line);
    border-radius:16px;
    padding:48px 24px;
    text-align:center;
    color:var(--muted);
  }
  .pay-zone strong{display:block;font-size:1rem;color:var(--ink);margin-bottom:4px;}

  footer{border-top:1px solid var(--line);}
  .foot-inner{max-width:640px;margin:0 auto;padding:20px;color:var(--muted);font-size:0.85rem;text-align:center;}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a href="index.html">Gadget<span>Grub</span></a>
    <a class="back" href="index.html">&larr; Back to store</a>
  </div>
</header>

<main>
  <h1>Checkout</h1>
  <p class="sub">Almost there. Complete your order below.</p>

  <!-- PAYMENT CODE GOES HERE -->
  <div class="pay-zone">
    <strong>Payment section</strong>
    Paste your payment code in this box.
  </div>
  <!-- END PAYMENT SECTION -->

</main>

<footer>
  <div class="foot-inner">
    <p>(c) 2026 GadgetGrub. All rights reserved.</p>
  </div>
</footer>

</body>
</html>
